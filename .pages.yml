# Pages CMS config — gives you a no-code editor for this site (https://pagescms.org)
media:
  input: uploads
  output: /uploads
  extensions: [docx, pptx, pdf, png, jpg]

content:
  - name: protocols
    label: Protocols
    type: file
    path: data/protocols.json
    fields:
      - name: protocols
        label: Protocols
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - name: category
            label: Type of protocol
            type: select
            options:
              values: [Molecular Biology, Cloning & CRISPR, Protein Analysis, Imaging & Microscopy, Cell Culture, Microbiology, Model Organisms, Genomics & Sequencing, Biochemistry, Immunology]
          - { name: date, label: Date (YYYY-MM-DD), type: string }
          - name: organism
            label: Organism
            type: select
            options:
              values: [Mammalian Cells, Mouse, Plant, Drosophila, C. elegans, Yeast, E. coli & Bacteria, Zebrafish, Other Organisms, General Lab Methods]
          - { name: duration, label: Duration, type: string }
          - { name: summary, label: Short summary, type: text }
          - { name: keywords, label: Search keywords, type: string }
          - name: sources
            label: Sources (papers, books, lab websites)
            type: object
            list: true
            fields:
              - { name: citation, label: Citation (authors, year, title, journal/book), type: text }
              - { name: link, label: Link (DOI or URL, optional), type: string }
          - { name: updated, label: Last updated (YYYY-MM-DD, fill in when you revise a protocol), type: string }
          - { name: revision_note, label: What changed in this update (shown on the site), type: text }
          - { name: word_file, label: Word file (upload a new one to replace), type: file }
          - { name: pptx_file, label: PowerPoint file, type: file }

  - name: site
    label: Comment settings
    type: file
    path: data/site.json
    fields:
      - { name: giscus_repo, label: GitHub repo (user/protocol-world), type: string }
      - { name: giscus_repo_id, label: Giscus repo ID, type: string }
      - { name: giscus_category, label: Giscus category name, type: string }
      - { name: giscus_category_id, label: Giscus category ID, type: string }
